$kind: http-request
method: POST
url: '{{base_url}}/matchmaking/queue/join'
order: 21000
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: '{{session_cookie}}'
body:
  type: json
  content: |-
    {"matchType": "FREE_FOR_ALL"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 400', () => pm.response.to.have.status(400));
