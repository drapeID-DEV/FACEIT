$kind: http-request
method: POST
url: '{{base_url}}/news'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"title": "x", "description": "y"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 401', () => pm.response.to.have.status(401));
