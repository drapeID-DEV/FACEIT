$kind: http-request
method: GET
url: '{{base_url}}/leaderboard'
order: 9000
headers:
  - key: Cookie
    value: '{{session_cookie}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const rows = body.players;
      const elos = rows.map(row => row.elo);
      pm.test('highest ELO first', () => pm.expect(elos).to.eql([...elos].sort((a, b) => b - a)));
