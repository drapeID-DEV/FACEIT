$kind: http-request
method: GET
url: '{{base_url}}/users/me'
order: 6000
headers:
  - key: Cookie
    value: '{{session_cookie}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.test('is the logged-in user', () => pm.expect(pm.response.json().nickname).to.eql('demo_1'));
      pm.test('has no password field', () => pm.expect(pm.response.json()).to.not.have.property('password'));
