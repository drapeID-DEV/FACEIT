$kind: http-request
method: POST
url: '{{base_url}}/matchmaking/queue/join'
order: 25000
headers:
  - key: Content-Type
    value: application/json
  - key: Cookie
    value: '{{session_cookie}}'
body:
  type: json
  content: |-
    {"matchType": "ONE_VS_ONE"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 403', () => pm.response.to.have.status(403));
      pm.test('explains that Steam is needed', () => pm.expect(pm.response.json().message).to.include('Steam'));
