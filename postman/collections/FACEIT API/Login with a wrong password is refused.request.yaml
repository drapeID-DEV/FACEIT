$kind: http-request
method: POST
url: '{{base_url}}/auth/login'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "demo_1@demo.local", "password": "wrong-password"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('returns 400', () => pm.response.to.have.status(400));
